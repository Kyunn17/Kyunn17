<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-label="Siswa RPL SMKN 4 Padalarang, sedang PKL di lingkungan software development. Nyaman di frontend; sekarang sedang belajar fullstack dan mengeksplor data engineering. Lebih suka paham kenapa sesuatu bekerja, dan paling cepat belajar lewat proyek nyata.">
  <title>About Terminal — Khairul Faridz</title>
  <desc>Panel terminal obsidian dan abu-abu bersih berisi perkenalan singkat Khairul Faridz.</desc>
  <style>
    .t-line { opacity: 1; }
    .cursor { opacity: 1; }
    @media (prefers-reduced-motion: no-preference) {
      @keyframes lineIn {
        0%   { opacity: 0.4; transform: translateY(3px); }
        100% { opacity: 1; transform: translateY(0px); }
      }
      @keyframes cursorBlink {
        0%, 49%  { opacity: 1; }
        50%,100% { opacity: 0; }
      }
      .t1 { animation: lineIn 0.25s ease-out 0s both; }
      .t2 { animation: lineIn 0.25s ease-out 0.08s both; }
      .t3 { animation: lineIn 0.25s ease-out 0.16s both; }
      .t4 { animation: lineIn 0.25s ease-out 0.24s both; }
      .t5 { animation: lineIn 0.25s ease-out 0.32s both; }
      .t6 { animation: lineIn 0.25s ease-out 0.40s both; }
      .t7 { animation: lineIn 0.25s ease-out 0.48s both; }
      .t8 { animation: lineIn 0.25s ease-out 0.56s both; }
      .cursor { animation: cursorBlink 1.2s steps(1) infinite; }
    }
  </style>
  <defs>
    <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0C0E"/>
      <stop offset="100%" stop-color="#13151A"/>
    </linearGradient>
    <clipPath id="termClip"><rect width="640" height="340" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#termClip)">
    <rect width="640" height="340" fill="url(#termBg)"/>

    <!-- TITLE BAR TERMINAL -->
    <rect width="640" height="40" fill="#16181F"/>
    <line x1="0" y1="40" x2="640" y2="40" stroke="#27272A" stroke-width="1.5"/>
    <circle cx="24" cy="20" r="5.5" fill="#DC2626"/>
    <circle cx="44" cy="20" r="5.5" fill="#52525B"/>
    <circle cx="64" cy="20" r="5.5" fill="#3F3F46"/>
    <text x="320" y="25" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15" fill="#9CA3AF">kf@kyunn17: ~/about</text>

    <!-- GANTI TEKS TERMINAL DI SINI -->
    <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18">
      <text class="t-line t1" x="28" y="80" fill="#F3F4F6"><tspan fill="#EF4444" font-weight="700">$</tspan> cat about.txt</text>
      <text class="t-line t2" x="28" y="116" fill="#F3F4F6">Siswa RPL SMKN 4 Padalarang, sedang PKL di</text>
      <text class="t-line t3" x="28" y="144" fill="#F3F4F6">lingkungan software development.</text>
      <text class="t-line t4" x="28" y="182" fill="#D1D5DB">Nyaman di frontend; sekarang sedang belajar</text>
      <text class="t-line t5" x="28" y="210" fill="#D1D5DB">fullstack dan mengeksplor data engineering.</text>
      <text class="t-line t6" x="28" y="248" fill="#9CA3AF">Lebih suka paham kenapa sesuatu bekerja,</text>
      <text class="t-line t7" x="28" y="276" fill="#9CA3AF">dan paling cepat belajar lewat proyek nyata.</text>
      <text class="t-line t8" x="28" y="314" fill="#EF4444" font-weight="700">$</text>
      <rect class="cursor" x="48" y="298" width="10" height="19" fill="#DC2626"/>
    </g>
  </g>
  <rect x="1" y="1" width="638" height="338" rx="13" fill="none" stroke="#27272A" stroke-width="2"/>
</svg>
