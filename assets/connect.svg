<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-label="Panel koneksi: 接続中 lalu 完了, connection established, handle kyunn17, dengan stempel hanko merah bertuliskan 開発者">
  <title>Connection Panel — @kyunn17</title>
  <desc>Panel kontak minimalis obsidian dan merah vermilion dengan log koneksi dan stempel hanko Jepang.</desc>
  <style>
    .c-log1, .c-log2 { opacity: 1; }
    @media (prefers-reduced-motion: no-preference) {
      @keyframes fadeIn {
        0%   { opacity: 0.4; }
        100% { opacity: 1; }
      }
      .c-log1 { animation: fadeIn 0.3s ease-out 0s both; }
      .c-log2 { animation: fadeIn 0.35s ease-out 0.25s both; }
    }
  </style>
  <defs>
    <linearGradient id="cBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0C0E"/>
      <stop offset="100%" stop-color="#13151A"/>
    </linearGradient>
    <clipPath id="cCardClip"><rect width="640" height="220" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#cCardClip)">
    <rect width="640" height="220" fill="url(#cBg)"/>

    <!-- HEADER BAR -->
    <rect width="640" height="44" fill="#16181F"/>
    <line x1="0" y1="44" x2="640" y2="44" stroke="#DC2626" stroke-width="2"/>
    <rect x="24" y="16" width="10" height="10" rx="2" fill="#DC2626"/>
    <text x="44" y="28" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18" font-weight="700" fill="#F3F4F6">CONNECTION // kyunn17</text>

    <!-- LOG KONEKSI (GANTI TEKS DI SINI) -->
    <text class="c-log1" x="28" y="84" font-family="ui-monospace,SFMono-Regular,Consolas,monospace,'Yu Gothic','Meiryo','Hiragino Sans',sans-serif" font-size="18" fill="#9CA3AF">&gt; 接続中 ...</text>
    <text class="c-log2" x="28" y="114" font-family="ui-monospace,SFMono-Regular,Consolas,monospace,'Yu Gothic','Meiryo','Hiragino Sans',sans-serif" font-size="18" font-weight="700" fill="#F3F4F6">&gt; <tspan fill="#EF4444">完了</tspan> - CONNECTION ESTABLISHED</text>

    <line x1="28" y1="136" x2="500" y2="136" stroke="#27272A" stroke-width="1"/>

    <text x="28" y="168" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="17" fill="#9CA3AF">handle: <tspan fill="#F3F4F6" font-weight="700">@kyunn17</tspan></text>
    <text x="28" y="196" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16" fill="#D1D5DB">Tautan kontak ada di bawah ↓</text>

    <!-- STEMPEL HANKO MERAH MINIMALIS DI SISI KANAN -->
    <g transform="translate(534 72)">
      <rect width="74" height="118" rx="8" fill="#991B1B" fill-opacity="0.18" stroke="#DC2626" stroke-width="2.5"/>
      <rect x="5" y="5" width="64" height="108" rx="5" fill="none" stroke="#DC2626" stroke-width="1" opacity="0.55"/>
      <text x="37" y="42" text-anchor="middle" font-family="'Yu Gothic','Meiryo','Hiragino Sans','Noto Sans JP',sans-serif" font-size="25" font-weight="800" fill="#EF4444">開<tspan x="37" dy="31">発</tspan><tspan x="37" dy="31">者</tspan></text>
    </g>
  </g>
  <rect x="1" y="1" width="638" height="218" rx="13" fill="none" stroke="#27272A" stroke-width="2"/>
</svg>
