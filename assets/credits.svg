<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Ending credits episode 1: Khairul Faridz, Frontend Developer, guild SMKN 4 Padalarang, quest PKL, daftar episode proyek, dan pesan penutup">
  <title>Ending Credits — Khairul Faridz (@kyunn17)</title>
  <desc>Kartu penutup bergaya ending credit roll anime dengan langit malam, bintang, dan kelopak sakura.</desc>
  <style>
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <defs>
    <linearGradient id="edBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1026"/>
      <stop offset="65%" stop-color="#161C45"/>
      <stop offset="100%" stop-color="#2A2563"/>
    </linearGradient>
    <linearGradient id="fadeTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1026" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0B1026" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeBot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A2563" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1E2052" stop-opacity="1"/>
    </linearGradient>
    <clipPath id="edClip">
      <rect width="720" height="400" rx="18"/>
    </clipPath>
    <clipPath id="rollWindow">
      <rect x="36" y="70" width="648" height="270"/>
    </clipPath>
    <symbol id="edPetal" viewBox="-10 -12 20 24">
      <path d="M0-10 C6-7 8-1 5 6 C2 10 0 10 0 10 C0 10-2 10-5 6 C-8-1-6-7 0-10 Z" fill="#F9A8D4" stroke="#EC4899" stroke-width="0.8"/>
    </symbol>
  </defs>

  <g clip-path="url(#edClip)">
    <rect width="720" height="400" fill="url(#edBg)"/>

    <!-- BINTANG TENANG -->
    <circle cx="88" cy="112" r="1.4" fill="#FFF4E0"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="148" cy="240" r="1.1" fill="#F9A8D4"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="585" cy="195" r="1.3" fill="#FFF4E0"><animate attributeName="opacity" values="0.25;0.9;0.25" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="638" cy="285" r="1.2" fill="#C7CBEA"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="5.2s" repeatCount="indefinite"/></circle>
    <circle cx="95" cy="312" r="1.2" fill="#FFF4E0"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.8s" repeatCount="indefinite"/></circle>

    <!-- BULAN SABIT KECIL -->
    <circle cx="645" cy="118" r="24" fill="#FFF4E0" opacity="0.9"/>
    <circle cx="655" cy="111" r="21" fill="#111638"/>

    <!-- KELOPAK SAKURA TENANG -->
    <g opacity="0.65"><animateMotion path="M110,-20 C145,120 85,260 125,420" dur="13s" begin="-4s" repeatCount="indefinite"/><use href="#edPetal" x="-7" y="-9" width="14" height="18"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/></use></g>
    <g opacity="0.55"><animateMotion path="M605,-20 C570,130 635,270 590,420" dur="15s" begin="-9s" repeatCount="indefinite"/><use href="#edPetal" x="-7" y="-9" width="14" height="18"><animateTransform attributeName="transform" type="rotate" from="30" to="-330" dur="8s" repeatCount="indefinite"/></use></g>

    <!-- HEADER ENDING -->
    <rect width="720" height="56" fill="#1E2456"/>
    <rect x="0" y="54" width="720" height="2" fill="#F472B6" opacity="0.65"/>
    <text x="32" y="36" font-family="ui-monospace,SFMono-Regular,Consolas,monospace,'Hiragino Sans','Yu Gothic','Meiryo','Noto Sans JP',sans-serif" font-size="20" font-weight="800" fill="#FFF4E0">ENDING · <tspan fill="#F9A8D4">エンディング</tspan></text>
    <text x="688" y="36" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18" fill="#C7CBEA">ED 01</text>

    <!-- JENDELA CREDIT ROLL -->
    <g clip-path="url(#rollWindow)">
      <g text-anchor="middle">
        <animateTransform attributeName="transform" type="translate" from="0 160" to="0 -670" dur="22s" repeatCount="indefinite"/>

        <text x="360" y="24" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18" fill="#F9A8D4">PEMERAN UTAMA</text>
        <text x="360" y="52" font-family="'Segoe UI',Roboto,sans-serif" font-size="24" font-weight="800" fill="#FFF4E0">Khairul Faridz (@kyunn17)</text>

        <text x="360" y="102" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18" fill="#F9A8D4">CLASS</text>
        <text x="360" y="130" font-family="'Segoe UI',Roboto,sans-serif" font-size="21" font-weight="700" fill="#FFF4E0">Frontend Developer</text>

        <text x="360" y="180" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18" fill="#FCD34D">SEDANG DI-UNLOCK</text>
        <text x="360" y="208" font-family="'Segoe UI',Roboto,sans-serif" font-size="21" font-weight="700" fill="#FFF4E0">Fullstack · Data Engineering</text>

        <text x="360" y="258" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18" fill="#67E8F9">GUILD &amp; QUEST</text>
        <text x="360" y="286" font-family="'Segoe UI',Roboto,sans-serif" font-size="20" font-weight="600" fill="#FFF4E0">SMKN 4 Padalarang · RPL</text>
        <text x="360" y="314" font-family="'Segoe UI',Roboto,sans-serif" font-size="19" fill="#C7CBEA">Quest saat ini: PKL software development</text>

        <text x="360" y="366" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18" fill="#F9A8D4">EPISODE PROYEK</text>
        <text x="360" y="394" font-family="'Segoe UI',Roboto,sans-serif" font-size="19" font-weight="600" fill="#FFF4E0">CSV Template Validation · LifeSync</text>
        <text x="360" y="422" font-family="'Segoe UI',Roboto,sans-serif" font-size="19" font-weight="600" fill="#FFF4E0">SBL Gym · CRITIPLAY (guest) · KF.</text>

        <text x="360" y="484" font-family="'Segoe UI',Roboto,sans-serif" font-size="22" font-weight="800" fill="#F9A8D4">Terima kasih sudah mampir!</text>
        <text x="360" y="518" font-family="'Segoe UI',Roboto,sans-serif" font-size="19" font-style="italic" fill="#FFF4E0">「Masih tumbuh, masih membangun.」</text>
        <text x="360" y="566" font-family="'Hiragino Sans','Yu Gothic','Meiryo','Noto Sans JP',sans-serif" font-size="26" font-weight="800" fill="#FCD34D">つづく</text>
      </g>

      <!-- EFEK FADE ATAS & BAWAH -->
      <rect x="36" y="70" width="648" height="32" fill="url(#fadeTop)"/>
      <rect x="36" y="308" width="648" height="32" fill="url(#fadeBot)"/>
    </g>

    <!-- FOOTER STATIS -->
    <line x1="36" y1="348" x2="684" y2="348" stroke="#2A2563" stroke-width="1.5"/>
    <text x="360" y="378" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18" fill="#C7CBEA">Kontak &amp; tautan ada di bawah ↓</text>
  </g>

  <rect x="1" y="1" width="718" height="398" rx="17" fill="none" stroke="#F472B6" stroke-opacity="0.6" stroke-width="2"/>
</svg>
