<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 24" width="1000" height="24" role="img" aria-label="Pembatas garis neon merah">
  <title>Pembatas Garis Neon Merah</title>
  <style>
    .base-line { stroke: #7a0a1a; }
    .scan { opacity: 0; }
    @media (prefers-color-scheme: light) {
      .base-line { stroke: #b3122e; }
    }
    @media (prefers-reduced-motion: no-preference) {
      @keyframes scanSweep {
        0%   { transform: translateX(-140px); }
        100% { transform: translateX(1000px); }
      }
      .scan {
        opacity: 1;
        animation: scanSweep 6s linear infinite;
      }
    }
  </style>
  <defs>
    <linearGradient id="neonSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff3b3b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff3b3b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ff3b3b" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="divClip">
      <rect x="20" y="0" width="960" height="24"/>
    </clipPath>
  </defs>

  <!-- GARIS DASAR & SIRKUIT KECIL -->
  <line class="base-line" x1="20" y1="12" x2="980" y2="12" stroke-width="2"/>
  <polyline class="base-line" points="160,12 174,5 210,5" fill="none" stroke-width="1.5"/>
  <polyline class="base-line" points="840,12 826,19 790,19" fill="none" stroke-width="1.5"/>

  <!-- NODE DIAMOND KIRI & KANAN -->
  <polygon points="20,6 26,12 20,18 14,12" fill="#ff1744"/>
  <polygon points="980,6 986,12 980,18 974,12" fill="#ff1744"/>
  <circle cx="500" cy="12" r="3" fill="#ff1744"/>

  <!-- KILAU NEON BERJALAN -->
  <g clip-path="url(#divClip)">
    <rect class="scan" x="0" y="10" width="120" height="4" rx="2" fill="url(#neonSweep)"/>
  </g>
</svg>
