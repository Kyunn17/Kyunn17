<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 20" width="1000" height="20" role="img" aria-label="Pembatas garis merah minimalis">
  <title>Pembatas Garis Minimalis</title>
  <style>
    .base-line { stroke: #3F3F46; }
    .scan { opacity: 0; }
    @media (prefers-color-scheme: light) {
      .base-line { stroke: #D1D5DB; }
    }
    @media (prefers-reduced-motion: no-preference) {
      @keyframes scanSweep {
        0%   { transform: translateX(-140px); }
        100% { transform: translateX(1000px); }
      }
      .scan {
        opacity: 1;
        animation: scanSweep 6.5s linear infinite;
      }
    }
  </style>
  <defs>
    <linearGradient id="crimsonSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DC2626" stop-opacity="0"/>
      <stop offset="50%" stop-color="#EF4444" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#DC2626" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="divClip">
      <rect x="20" y="0" width="960" height="20"/>
    </clipPath>
  </defs>

  <line class="base-line" x1="20" y1="10" x2="980" y2="10" stroke-width="1.5"/>
  <rect x="18" y="7" width="6" height="6" fill="#DC2626"/>
  <rect x="976" y="7" width="6" height="6" fill="#DC2626"/>
  <polygon points="500,4 506,10 500,16 494,10" fill="#DC2626"/>

  <g clip-path="url(#divClip)">
    <rect class="scan" x="0" y="8.5" width="120" height="3" rx="1.5" fill="url(#crimsonSweep)"/>
  </g>
</svg>
