<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 40" width="1000" height="40" role="img" aria-label="Pembatas: ranting sakura">
  <title>Pembatas ranting sakura</title>
  <style>
    .branch { stroke: #6D597A; }
    .blossom { fill: #EC4899; }
    .center { fill: #FFF4E0; }
    .petal-drift { fill: #F472B6; }
    @media (prefers-color-scheme: dark) {
      .branch { stroke: #C7CBEA; }
      .blossom { fill: #F9A8D4; }
      .center { fill: #0B1026; }
      .petal-drift { fill: #F9A8D4; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <defs>
    <symbol id="sakura5" viewBox="-12 -12 24 24">
      <g class="blossom">
        <ellipse cx="0" cy="-6" rx="3.2" ry="5.5"/>
        <ellipse cx="0" cy="-6" rx="3.2" ry="5.5" transform="rotate(72)"/>
        <ellipse cx="0" cy="-6" rx="3.2" ry="5.5" transform="rotate(144)"/>
        <ellipse cx="0" cy="-6" rx="3.2" ry="5.5" transform="rotate(216)"/>
        <ellipse cx="0" cy="-6" rx="3.2" ry="5.5" transform="rotate(288)"/>
      </g>
      <circle cx="0" cy="0" r="2.3" class="center"/>
    </symbol>
  </defs>

  <!-- RANTING HALUS -->
  <path class="branch" d="M24 22 Q180 12 340 21 T660 19 T976 22" fill="none" stroke-width="2" stroke-linecap="round" opacity="0.75"/>

  <!-- BUNGA SAKURA SEPANJANG RANTING -->
  <use href="#sakura5" x="128" y="6" width="20" height="20"/>
  <use href="#sakura5" x="328" y="10" width="22" height="22"/>
  <use href="#sakura5" x="490" y="9" width="24" height="24"/>
  <use href="#sakura5" x="648" y="9" width="22" height="22"/>
  <use href="#sakura5" x="846" y="10" width="20" height="20"/>

  <!-- KELOPAK MELAYANG PELAN -->
  <ellipse class="petal-drift" cx="0" cy="0" rx="5.5" ry="3.2" opacity="0.85">
    <animateMotion path="M40,20 Q300,8 560,22 T960,18" dur="11s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse class="petal-drift" cx="0" cy="0" rx="4.5" ry="2.8" opacity="0.7">
    <animateMotion path="M950,20 Q700,30 440,18 T40,22" dur="14s" begin="-5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="6s" repeatCount="indefinite"/>
  </ellipse>
</svg>
