<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300" role="img" aria-label="Profile overview bento grid: Vocational Software Engineering student at SMKN 4 Padalarang on PKL internship; engineering mindset focused on understanding fundamentals and building real projects; current depth showing Frontend as Comfortable, Fullstack as Actively Learning, and Data Engineering as Exploring.">
