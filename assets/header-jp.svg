<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="Header bertema Jepang minimalis: Khairul Faridz, Frontend Developer yang sedang leveling up ke Fullstack dan Data Engineering, dengan siluet gerbang torii dan matahari merah">
  <title>Khairul Faridz — Modern Japanese Minimalist Header</title>
  <desc>Header bergaya sumi-e dan vermilion minimalis dengan siluet gunung, gerbang torii, matahari merah, dan tipografi bersih.</desc>
  <style>
    .h-fade-1, .h-fade-2, .h-fade-3, .h-fade-4 { opacity: 1; }
    .sun-disc { opacity: 0.96; }
    @media (prefers-reduced-motion: no-preference) {
      @keyframes fadeUp {
        0%   { opacity: 0.4; transform: translateY(6px); }
        100% { opacity: 1; transform: translateY(0px); }
      }
      @keyframes sunBreathe {
        0%, 100% { opacity: 0.92; }
        50%      { opacity: 1; }
      }
      .h-fade-1 { animation: fadeUp 0.35s ease-out 0s    both; }
      .h-fade-2 { animation: fadeUp 0.4s  ease-out 0.1s  both; }
      .h-fade-3 { animation: fadeUp 0.4s  ease-out 0.2s  both; }
      .h-fade-4 { animation: fadeUp 0.45s ease-out 0.3s  both; }
      .sun-disc { animation: sunBreathe 6s ease-in-out infinite; }
    }
  </style>
  <defs>
    <!-- PALET: Sumi-e Obsidian + Japanese Vermilion -->
    <linearGradient id="bgObsidian" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0C0E"/>
      <stop offset="60%" stop-color="#13151A"/>
      <stop offset="100%" stop-color="#181A20"/>
    </linearGradient>
    <radialGradient id="crimsonSun" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="65%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </radialGradient>
    <radialGradient id="sunAura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#DC2626" stop-opacity="0.20"/>
      <stop offset="65%" stop-color="#991B1B" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0B0C0E" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="hdrClip">
      <rect width="1000" height="360" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#hdrClip)">
    <!-- LATAR MATTE OBSIDIAN -->
    <rect width="1000" height="360" fill="url(#bgObsidian)"/>
    <!-- GARIS AKSEN MERAH TIPIS DI ATAS -->
    <rect x="0" y="0" width="1000" height="3" fill="#DC2626"/>

    <!-- GARIS HORIZON & GRID HALUS -->
    <line x1="0" y1="286" x2="1000" y2="286" stroke="#27272A" stroke-width="1"/>
    <line x1="630" y1="44" x2="630" y2="320" stroke="#27272A" stroke-width="1" stroke-dasharray="4 6"/>

    <!-- SISI KANAN: MATAHARI MERAH, SILUET GUNUNG & GERBANG TORII -->
    <circle cx="790" cy="176" r="150" fill="url(#sunAura)"/>
    <circle class="sun-disc" cx="790" cy="176" r="98" fill="url(#crimsonSun)"/>

    <!-- SILUET GUNUNG MINIMAL -->
    <path d="M620,286 L724,208 L764,232 L836,188 L930,286 Z" fill="#0F1116"/>

    <!-- SILUET GERBANG TORII BERSIH -->
    <g>
      <!-- Kasagi (balok atas melengkung sedikit) -->
      <path d="M726,184 Q790,192 854,184 L850,195 Q790,201 730,195 Z" fill="#0B0C0E"/>
      <path d="M726,184 Q790,192 854,184" fill="none" stroke="#DC2626" stroke-width="2" opacity="0.85"/>
      <!-- Nuki (balok kedua) -->
      <rect x="742" y="208" width="96" height="8" rx="1" fill="#0B0C0E"/>
      <!-- Pilar kiri dan kanan -->
      <rect x="756" y="191" width="11" height="95" fill="#0B0C0E"/>
      <rect x="813" y="191" width="11" height="95" fill="#0B0C0E"/>
      <!-- Gakuzuka (penyangga tengah) -->
      <rect x="786" y="194" width="8" height="16" fill="#0B0C0E"/>
      <!-- Alas pilar -->
      <rect x="752" y="278" width="19" height="8" fill="#181A20"/>
      <rect x="809" y="278" width="19" height="8" fill="#181A20"/>
    </g>

    <!-- KANJI VERTIKAL MINIMAL (HANYA WHITELIST: 開発者) -->
    <g>
      <rect x="930" y="72" width="38" height="148" rx="4" fill="#13151A" stroke="#27272A" stroke-width="1"/>
      <text x="949" y="114" text-anchor="middle" font-family="'Yu Gothic','Meiryo','Hiragino Sans','Noto Sans JP',sans-serif" font-size="24" font-weight="700" fill="#DC2626" opacity="0.9">開<tspan x="949" dy="38">発</tspan><tspan x="949" dy="38">者</tspan></text>
    </g>

    <!-- SISI KIRI: TIPOGRAFI IDENTITAS (GANTI TEKS DI SINI) -->
    <!-- STEMPEL KECIL + HANDLE -->
    <g class="h-fade-1">
      <rect x="52" y="46" width="12" height="12" rx="2" fill="#DC2626"/>
      <text x="74" y="58" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16" font-weight="700" fill="#9CA3AF">KF. // @kyunn17</text>

      <!-- BOOT LOG SINGKAT -->
      <text x="52" y="96" font-family="ui-monospace,SFMono-Regular,Consolas,monospace,'Yu Gothic','Meiryo','Hiragino Sans',sans-serif" font-size="16" fill="#D1D5DB">&gt; システム起動 · <tspan fill="#EF4444" font-weight="700">完了</tspan></text>
    </g>

    <!-- NAMA UTAMA -->
    <g class="h-fade-2">
      <rect x="52" y="128" width="4" height="54" rx="2" fill="#DC2626"/>
      <text x="70" y="172" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="56" font-weight="800" fill="#F3F4F6">Khairul Faridz</text>
    </g>

    <!-- SUBTITLE (2 BARIS RAPI AGAR TIDAK MENABRAK ILUSTRASI KANAN) -->
    <g class="h-fade-3">
      <text x="52" y="218" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#F3F4F6">Frontend Developer</text>
      <text x="52" y="246" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="500" fill="#9CA3AF">Leveling up to Fullstack &amp; Data Engineering</text>
    </g>

    <!-- MOTTO -->
    <g class="h-fade-4">
      <text x="52" y="320" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="17" font-weight="600" fill="#D1D5DB"><tspan fill="#EF4444" font-weight="700">&gt;</tspan> paham dulu cara kerjanya, baru ngebut.</text>
    </g>
  </g>

  <rect x="1" y="1" width="998" height="358" rx="13" fill="none" stroke="#27272A" stroke-width="2"/>
</svg>
