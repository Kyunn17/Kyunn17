<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="Title card opening: Khairul Faridz, Frontend Developer yang sedang leveling up ke Fullstack dan Data Engineering">
  <title>Opening Title Card — Khairul Faridz (@kyunn17)</title>
  <desc>Anime opening title card bergaya Sakura malam dengan speed lines, halftone, bulan sabit purnama, bintang berkedip, dan kelopak sakura jatuh.</desc>
  <style>
    .op-chip, .op-title, .op-id, .op-sub { opacity: 1; }
    @media (prefers-reduced-motion: no-preference) {
      @keyframes opReveal {
        0% { opacity: 0.82; transform: translateY(8px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      .op-chip  { animation: opReveal 0.45s ease-out 0s    both; }
      .op-title { animation: opReveal 0.6s  ease-out 0.1s  both; }
      .op-id    { animation: opReveal 0.5s  ease-out 0.25s both; }
      .op-sub   { animation: opReveal 0.55s ease-out 0.4s  both; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <defs>
    <!-- PALET: ubah warna langit & aksen di sini -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0%" stop-color="#0B1026"/>
      <stop offset="45%" stop-color="#161C45"/>
      <stop offset="78%" stop-color="#2A2563"/>
      <stop offset="100%" stop-color="#7A3B6E"/>
    </linearGradient>
    <radialGradient id="horizonGlow" cx="0.5" cy="1" r="0.65">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#7A3B6E" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0B1026" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFF4E0" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#F9A8D4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0B1026" stop-opacity="0"/>
    </radialGradient>
    <pattern id="halftone" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="2.1" fill="#F472B6"/>
    </pattern>
    <pattern id="moonDots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.4" fill="#2A2563" opacity="0.55"/>
    </pattern>
    <radialGradient id="cornerMaskTL" cx="0.06" cy="0.08" r="0.45">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cornerMaskBR" cx="0.94" cy="0.92" r="0.45">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="halftoneMask">
      <rect width="1000" height="420" fill="#000000"/>
      <rect width="1000" height="420" fill="url(#cornerMaskTL)"/>
      <rect width="1000" height="420" fill="url(#cornerMaskBR)"/>
    </mask>
    <mask id="moonShadowMask">
      <circle cx="892" cy="134" r="38" fill="#ffffff"/>
      <circle cx="906" cy="124" r="34" fill="#000000"/>
    </mask>
    <clipPath id="cardClip">
      <rect width="1000" height="420" rx="20"/>
    </clipPath>

    <!-- SIMBOL BINTANG & KELOPAK SAKURA -->
    <symbol id="star4" viewBox="-8 -8 16 16">
      <path d="M0-7 L1.5-1.5 L7 0 L1.5 1.5 L0 7 L-1.5 1.5 L-7 0 L-1.5-1.5 Z" fill="#FFF4E0"/>
    </symbol>
    <symbol id="petal" viewBox="-12 -14 24 28">
      <path d="M0-12 C7-9 10-1 6 7 C3 11 1 12 0 12 C-1 12-3 11-6 7 C-10-1-7-9 0-12 Z M0-12 L0-7" fill="#F9A8D4" stroke="#EC4899" stroke-width="0.9"/>
      <path d="M0-6 C0.5 0 0.5 5 0 9" fill="none" stroke="#EC4899" stroke-width="0.7" opacity="0.55"/>
    </symbol>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- LAYER 1: LANGIT MALAM & CAHAYA HORIZON -->
    <rect width="1000" height="420" fill="url(#skyGrad)"/>
    <rect width="1000" height="420" fill="url(#horizonGlow)"/>

    <!-- LAYER 2: BINTANG BERKEDIP & BULAN -->
    <g id="stars">
      <circle cx="72" cy="95" r="1.4" fill="#FFF4E0"><animate attributeName="opacity" values="0.25;0.95;0.25" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="145" cy="142" r="1.1" fill="#F9A8D4"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="4.2s" repeatCount="indefinite"/></circle>
      <circle cx="218" cy="78" r="1.6" fill="#FFF4E0"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="290" cy="118" r="1.0" fill="#C7CBEA"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="5.1s" repeatCount="indefinite"/></circle>
      <circle cx="368" cy="64" r="1.5" fill="#FFF4E0"><animate attributeName="opacity" values="0.35;0.95;0.35" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="445" cy="96" r="1.2" fill="#F9A8D4"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="4.6s" repeatCount="indefinite"/></circle>
      <circle cx="535" cy="70" r="1.4" fill="#FFF4E0"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.7s" repeatCount="indefinite"/></circle>
      <circle cx="612" cy="112" r="1.1" fill="#C7CBEA"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="4.9s" repeatCount="indefinite"/></circle>
      <circle cx="688" cy="74" r="1.6" fill="#FFF4E0"><animate attributeName="opacity" values="0.25;0.95;0.25" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="745" cy="136" r="1.2" fill="#F9A8D4"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="4.1s" repeatCount="indefinite"/></circle>
      <circle cx="932" cy="158" r="1.5" fill="#FFF4E0"><animate attributeName="opacity" values="0.25;0.95;0.25" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="955" cy="240" r="1.1" fill="#C7CBEA"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="5.2s" repeatCount="indefinite"/></circle>
      <circle cx="58" cy="248" r="1.3" fill="#FFF4E0"><animate attributeName="opacity" values="0.25;0.9;0.25" dur="4.4s" repeatCount="indefinite"/></circle>
      <circle cx="116" cy="285" r="1.1" fill="#F9A8D4"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.9s" repeatCount="indefinite"/></circle>
      <circle cx="905" cy="288" r="1.3" fill="#F9A8D4"><animate attributeName="opacity" values="0.25;0.9;0.25" dur="4.7s" repeatCount="indefinite"/></circle>
      <circle cx="640" cy="260" r="1.0" fill="#FFF4E0"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="5.4s" repeatCount="indefinite"/></circle>
      <use href="#star4" x="172" y="102" width="12" height="12"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" repeatCount="indefinite"/></use>
      <use href="#star4" x="642" y="76" width="14" height="14"><animate attributeName="opacity" values="0.35;1;0.35" dur="4.0s" repeatCount="indefinite"/></use>
      <use href="#star4" x="920" y="90" width="12" height="12"><animate attributeName="opacity" values="0.25;0.95;0.25" dur="4.5s" repeatCount="indefinite"/></use>
      <use href="#star4" x="80" y="182" width="10" height="10"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.8s" repeatCount="indefinite"/></use>
    </g>

    <circle cx="892" cy="134" r="82" fill="url(#moonHalo)"/>
    <circle cx="892" cy="134" r="38" fill="#FFF4E0"/>
    <circle cx="892" cy="134" r="38" fill="url(#moonDots)" mask="url(#moonShadowMask)"/>

    <!-- LAYER 3: MANGA HALFTONE SCREENTONE DI SUDUT -->
    <rect width="1000" height="420" fill="url(#halftone)" opacity="0.24" mask="url(#halftoneMask)"/>

    <!-- LAYER 4: SPEED LINES RADIAL HALUS -->
    <g id="speed-lines" fill="#FFF4E0">
      <g opacity="0.09"><animate attributeName="opacity" values="0.06;0.14;0.06" dur="3.4s" repeatCount="indefinite"/>
        <polygon points="500,195 0,25 0,34"/>
        <polygon points="500,195 0,95 0,104"/>
        <polygon points="500,195 0,185 0,194"/>
        <polygon points="500,195 0,280 0,290"/>
        <polygon points="500,195 0,365 0,376"/>
        <polygon points="500,195 1000,30 1000,40"/>
        <polygon points="500,195 1000,115 1000,124"/>
        <polygon points="500,195 1000,205 1000,214"/>
        <polygon points="500,195 1000,295 1000,305"/>
        <polygon points="500,195 1000,372 1000,382"/>
      </g>
      <g opacity="0.07"><animate attributeName="opacity" values="0.11;0.05;0.11" dur="4.2s" repeatCount="indefinite"/>
        <polygon points="500,195 110,0 124,0"/>
        <polygon points="500,195 255,0 268,0"/>
        <polygon points="500,195 735,0 748,0"/>
        <polygon points="500,195 885,0 898,0"/>
        <polygon points="500,195 130,420 144,420"/>
        <polygon points="500,195 290,420 302,420"/>
        <polygon points="500,195 705,420 718,420"/>
        <polygon points="500,195 860,420 874,420"/>
      </g>
    </g>

    <!-- LAYER 5: KELOPAK SAKURA JATUH (animasi melengkung + berputar) -->
    <g id="sakura-petals">
      <g><animateMotion path="M120,-25 C170,110 90,260 155,445" dur="11s" begin="-2s" repeatCount="indefinite"/><use href="#petal" x="-9" y="-11" width="18" height="22"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/></use></g>
      <g><animateMotion path="M260,-30 C210,130 305,270 250,445" dur="13s" begin="-7s" repeatCount="indefinite"/><use href="#petal" x="-8" y="-10" width="16" height="20" opacity="0.85"><animateTransform attributeName="transform" type="rotate" from="45" to="-315" dur="7s" repeatCount="indefinite"/></use></g>
      <g><animateMotion path="M410,-25 C460,120 385,250 430,445" dur="10.5s" begin="-4s" repeatCount="indefinite"/><use href="#petal" x="-7" y="-9" width="14" height="18" opacity="0.7"><animateTransform attributeName="transform" type="rotate" from="10" to="370" dur="5.5s" repeatCount="indefinite"/></use></g>
      <g><animateMotion path="M590,-25 C540,125 620,275 560,445" dur="12.5s" begin="-9s" repeatCount="indefinite"/><use href="#petal" x="-9" y="-11" width="18" height="22" opacity="0.85"><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="6.5s" repeatCount="indefinite"/></use></g>
      <g><animateMotion path="M740,-30 C795,120 715,280 770,445" dur="9.8s" begin="-1.5s" repeatCount="indefinite"/><use href="#petal" x="-8" y="-10" width="16" height="20"><animateTransform attributeName="transform" type="rotate" from="90" to="450" dur="5.8s" repeatCount="indefinite"/></use></g>
      <g><animateMotion path="M895,-25 C840,135 925,270 865,445" dur="14s" begin="-6s" repeatCount="indefinite"/><use href="#petal" x="-9" y="-11" width="18" height="22" opacity="0.9"><animateTransform attributeName="transform" type="rotate" from="20" to="-340" dur="7.2s" repeatCount="indefinite"/></use></g>
      <g><animateMotion path="M50,-25 C105,130 35,285 95,445" dur="15s" begin="-11s" repeatCount="indefinite"/><use href="#petal" x="-7" y="-9" width="14" height="18" opacity="0.75"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6.8s" repeatCount="indefinite"/></use></g>
      <g><animateMotion path="M960,-25 C910,120 970,275 915,445" dur="11.5s" begin="-5s" repeatCount="indefinite"/><use href="#petal" x="-7" y="-9" width="14" height="18" opacity="0.8"><animateTransform attributeName="transform" type="rotate" from="60" to="-300" dur="5.2s" repeatCount="indefinite"/></use></g>
    </g>

    <!-- LAYER 6: LETTERBOX SINEMATIK ANIME -->
    <rect x="0" y="0" width="1000" height="26" fill="#05070F"/>
    <rect x="0" y="394" width="1000" height="26" fill="#05070F"/>

    <!-- LAYER 7: CHIP EPISODE & JUDUL OPENING (GANTI TEKS DI SINI) -->
    <g class="op-chip">
      <rect x="34" y="42" width="318" height="36" rx="18" fill="#0B1026" fill-opacity="0.82" stroke="#F472B6" stroke-width="1.5"/>
      <text x="193" y="67" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace,'Hiragino Sans','Yu Gothic','Meiryo','Noto Sans JP',sans-serif" font-size="20" font-weight="700" fill="#F9A8D4">OPENING · オープニング</text>

      <rect x="706" y="42" width="260" height="36" rx="18" fill="#0B1026" fill-opacity="0.82" stroke="#FCD34D" stroke-width="1.5"/>
      <text x="836" y="67" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Meiryo','Noto Sans JP','Segoe UI',Roboto,sans-serif" font-size="20" font-weight="700" fill="#FCD34D">第1話「レベルアップ」</text>
    </g>

    <!-- JUDUL UTAMA + EFEK OFFSET CETAK MANGA -->
    <g class="op-title">
      <text x="505" y="198" text-anchor="middle" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="82" font-weight="900" fill="#EC4899" opacity="0.72">Khairul Faridz</text>
      <text x="500" y="193" text-anchor="middle" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="82" font-weight="900" fill="#FFF4E0" stroke="#0B1026" stroke-width="5" paint-order="stroke">Khairul Faridz</text>
    </g>

    <!-- IDENTITAS SINGKAT -->
    <g class="op-id">
      <text x="500" y="246" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="20" font-weight="600" fill="#C7CBEA">@kyunn17  ·  SMKN 4 Padalarang  ·  RPL</text>
    </g>

    <!-- SUBTITLE ANIME DI BAWAH -->
    <g class="op-sub">
      <rect x="64" y="294" width="872" height="58" rx="12" fill="#05070F" fill-opacity="0.78" stroke="#F472B6" stroke-opacity="0.5" stroke-width="1.5"/>
      <text x="500" y="331" text-anchor="middle" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="700" fill="#FFF4E0" stroke="#05070F" stroke-width="4" paint-order="stroke">Frontend Developer · Leveling up to Fullstack &amp; Data Engineering</text>
    </g>
  </g>

  <!-- BINGKAI LUAR -->
  <rect x="1" y="1" width="998" height="418" rx="19" fill="none" stroke="#F472B6" stroke-opacity="0.65" stroke-width="2"/>
</svg>
