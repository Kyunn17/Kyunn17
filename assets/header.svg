<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="1000" height="350" role="img" aria-label="Khairul Faridz — Frontend-Focused Developer expanding into Fullstack and Data Engineering. System flow from Interface to Application to Data Layer.">
  <title>Khairul Faridz (KF.) — Developer Profile Header</title>
  <desc>Editorial engineering header featuring Khairul Faridz's identity on the left and a three-tier Interface-to-Data architecture diagram on the right.</desc>
  <style>
    .pulse-dot { opacity: 0.95; }
    .flow-packet { opacity: 0; }

    @media (prefers-reduced-motion: no-preference) {
      @keyframes statusPulse {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.4; }
      }
      @keyframes packetDrop1 {
        0%   { opacity: 0; transform: translateY(0px); }
        20%  { opacity: 1; }
        45%  { opacity: 1; transform: translateY(22px); }
        55%, 100% { opacity: 0; transform: translateY(22px); }
      }
      @keyframes packetDrop2 {
        0%, 45% { opacity: 0; transform: translateY(0px); }
        65%  { opacity: 1; }
        90%  { opacity: 1; transform: translateY(22px); }
        100% { opacity: 0; transform: translateY(22px); }
      }
      .pulse-dot { animation: statusPulse 2.8s ease-in-out infinite; }
      .flow-1 { animation: packetDrop1 3.6s ease-in-out infinite; }
      .flow-2 { animation: packetDrop2 3.6s ease-in-out infinite; }
    }
  </style>

  <defs>
    <!-- BRAND PALETTE: Graphite + KF. Portfolio Slate (#687C99) + Warm Ivory (#F7F6F2) -->
    <linearGradient id="canvasBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="55%" stop-color="#111722"/>
      <stop offset="100%" stop-color="#161F2E"/>
    </linearGradient>
    <radialGradient id="slateGlow" cx="0.78" cy="0.5" r="0.48">
      <stop offset="0%" stop-color="#687C99" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <pattern id="draftGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#687C99" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <clipPath id="cardClip">
      <rect width="1000" height="350" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- BACKGROUND & SUBTLE DRAFTING GRID -->
    <rect width="1000" height="350" fill="url(#canvasBg)"/>
    <rect width="1000" height="350" fill="url(#draftGrid)"/>
    <rect width="1000" height="350" fill="url(#slateGlow)"/>
    <rect x="0" y="0" width="1000" height="3" fill="#687C99"/>

    <!-- VERTICAL DIVIDER BETWEEN IDENTITY & ARCHITECTURE -->
    <line x1="566" y1="36" x2="566" y2="314" stroke="#263244" stroke-width="1"/>

    <!-- LEFT COLUMN: PERSONAL IDENTITY -->
    <g class="fade-1">
      <!-- KF. Brand Mark -->
      <rect x="48" y="42" width="38" height="32" rx="6" fill="#687C99"/>
      <text x="67" y="64" text-anchor="middle" font-family="'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="16" font-weight="800" fill="#F7F6F2">KF.</text>

      <!-- Handle & Status Pill -->
      <text x="98" y="63" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" font-weight="600" fill="#94A3B8">@kyunn17</text>
      <rect x="188" y="45" width="228" height="26" rx="13" fill="#15222B" stroke="#263B44" stroke-width="1"/>
      <circle class="pulse-dot" cx="204" cy="58" r="4" fill="#34D399"/>
      <text x="216" y="63" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" font-weight="600" fill="#CBD5E1">Software Dev Intern (PKL)</text>
    </g>

    <g class="fade-2">
      <!-- Name & Role -->
      <text x="48" y="146" font-family="'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="54" font-weight="800" letter-spacing="-0.8" fill="#F7F6F2">Khairul Faridz</text>
      <text x="48" y="188" font-family="'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="22" font-weight="700" fill="#8FA6C4">Frontend-Focused Developer</text>
      <text x="48" y="216" font-family="'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="500" fill="#94A3B8">Expanding into Fullstack &amp; Data Engineering</text>
    </g>

    <g class="fade-3">
      <!-- Location / School & Engineering Principle -->
      <line x1="48" y1="254" x2="526" y2="254" stroke="#222D3D" stroke-width="1"/>
      <text x="48" y="280" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" fill="#94A3B8">SMKN 4 Padalarang · Software Engineering (RPL) · Indonesia</text>
      <rect x="48" y="296" width="3" height="18" rx="1.5" fill="#687C99"/>
      <text x="60" y="310" font-family="'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="15" font-style="italic" fill="#CBD5E1">"Understand why it works first — then move fast."</text>
    </g>

    <!-- RIGHT COLUMN: BESPOKE END-TO-END ARCHITECTURE SCHEMATIC -->
    <g class="fade-2">
      <text x="598" y="56" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="0.8" fill="#8FA6C4">ARCHITECTURE FOCUS // SCREEN TO DATA</text>

      <!-- TIER 01: INTERFACE (CORE) -->
      <rect x="598" y="72" width="356" height="68" rx="9" fill="#162030" stroke="#687C99" stroke-width="1.6"/>
      <circle cx="618" cy="94" r="4.5" fill="#34D399"/>
      <text x="631" y="99" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" font-weight="700" fill="#F7F6F2">01 · INTERFACE</text>
      <rect x="872" y="82" width="68" height="22" rx="5" fill="#687C99" fill-opacity="0.28" stroke="#8FA6C4" stroke-width="1"/>
      <text x="906" y="97" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" font-weight="700" fill="#F7F6F2">CORE</text>
      <text x="618" y="124" font-family="'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#CBD5E1">React · Next.js · TypeScript · Tailwind CSS</text>

      <!-- Connector 1 -> 2 -->
      <line x1="776" y1="140" x2="776" y2="164" stroke="#36465E" stroke-width="1.5"/>
      <circle class="flow-packet flow-1" cx="776" cy="141" r="3" fill="#8FA6C4"/>

      <!-- TIER 02: APPLICATION (IN TRAINING) -->
      <rect x="598" y="164" width="356" height="68" rx="9" fill="#131B27" stroke="#33435B" stroke-width="1.4"/>
      <circle cx="618" cy="186" r="4.5" fill="#F59E0B"/>
      <text x="631" y="191" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" font-weight="700" fill="#F7F6F2">02 · APPLICATION</text>
      <rect x="850" y="174" width="90" height="22" rx="5" fill="#F59E0B" fill-opacity="0.14" stroke="#F59E0B" stroke-opacity="0.6" stroke-width="1"/>
      <text x="895" y="189" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" font-weight="700" fill="#FCD34D">LEARNING</text>
      <text x="618" y="216" font-family="'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#94A3B8">Node.js · Hono · PostgreSQL · Drizzle ORM</text>

      <!-- Connector 2 -> 3 -->
      <line x1="776" y1="232" x2="776" y2="256" stroke="#36465E" stroke-width="1.5"/>
      <circle class="flow-packet flow-2" cx="776" cy="233" r="3" fill="#38BDF8"/>

      <!-- TIER 03: DATA LAYER (EXPLORING) -->
      <rect x="598" y="256" width="356" height="68" rx="9" fill="#111823" stroke="#33435B" stroke-width="1.4" stroke-dasharray="5 4"/>
      <circle cx="618" cy="278" r="4.5" fill="#38BDF8"/>
      <text x="631" y="283" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" font-weight="700" fill="#F7F6F2">03 · DATA PIPELINE</text>
      <rect x="844" y="266" width="96" height="22" rx="5" fill="#38BDF8" fill-opacity="0.12" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="1"/>
      <text x="892" y="281" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" font-weight="700" fill="#7DD3FC">EXPLORING</text>
      <text x="618" y="308" font-family="'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#94A3B8">Databricks · PySpark · SQL · Medallion</text>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="998.5" height="348.5" rx="13.25" fill="none" stroke="#263244" stroke-width="1.5"/>
</svg>
