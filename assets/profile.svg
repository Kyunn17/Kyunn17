<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" width="560" height="520" role="img" aria-label="Kartu status karakter Khairul Faridz: Frontend Developer, sub-class Fullstack dan Data Engineering sedang di-unlock, Guild SMKN 4 Padalarang RPL, Quest PKL">
  <title>Character Profile — Khairul Faridz</title>
  <desc>Kartu status bergaya RPG anime berisi nama, class, sub-class, guild, quest PKL, dan progres belajar kualitatif.</desc>
  <style>
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#0B1026"/>
      <stop offset="65%" stop-color="#161C45"/>
      <stop offset="100%" stop-color="#2A2563"/>
    </linearGradient>
    <linearGradient id="shimmerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFF4E0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FCD34D" stop-opacity="0"/>
    </linearGradient>
    <pattern id="cornerDots" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1.6" fill="#F472B6"/>
    </pattern>
    <clipPath id="unlockChipClip">
      <rect x="156" y="182" width="218" height="30" rx="15"/>
    </clipPath>
    <clipPath id="cardRound">
      <rect width="560" height="520" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardRound)">
    <rect width="560" height="520" fill="url(#cardBg)"/>
    <!-- AKSEN HALFTONE POJOK KANAN BAWAH -->
    <rect x="380" y="380" width="180" height="140" fill="url(#cornerDots)" opacity="0.14"/>

    <!-- HEADER KARTU -->
    <rect width="560" height="54" fill="#1E2456"/>
    <rect x="0" y="52" width="560" height="2" fill="#F472B6" opacity="0.65"/>
    <circle cx="28" cy="27" r="6" fill="#F472B6"/>
    <text x="44" y="34" font-family="ui-monospace,SFMono-Regular,Consolas,monospace,'Hiragino Sans','Yu Gothic','Meiryo','Noto Sans JP',sans-serif" font-size="19" font-weight="700" fill="#FFF4E0">CHARACTER STATUS · <tspan fill="#F9A8D4">ステータス</tspan></text>

    <!-- BARIS IDENTITAS (GANTI TEKS DI SINI) -->
    <text x="28" y="92" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18" fill="#C7CBEA">NAMA</text>
    <text x="156" y="92" font-family="'Segoe UI',Roboto,sans-serif" font-size="22" font-weight="800" fill="#FFF4E0">Khairul Faridz</text>

    <text x="28" y="132" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18" fill="#C7CBEA">CLASS</text>
    <text x="156" y="132" font-family="'Segoe UI',Roboto,sans-serif" font-size="20" font-weight="700" fill="#F9A8D4">Frontend Developer</text>

    <text x="28" y="172" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18" fill="#C7CBEA">SUB-CLASS</text>
    <text x="156" y="172" font-family="'Segoe UI',Roboto,sans-serif" font-size="19" font-weight="600" fill="#FFF4E0">Fullstack · Data Engineering</text>

    <!-- CHIP SHIMMER "SEDANG DI-UNLOCK" + IKON GEMBOK VEKTOR -->
    <rect x="156" y="182" width="218" height="30" rx="15" fill="#FCD34D" fill-opacity="0.16" stroke="#FCD34D" stroke-width="1.3"/>
    <g clip-path="url(#unlockChipClip)">
      <rect x="56" y="182" width="90" height="30" fill="url(#shimmerGrad)">
        <animate attributeName="x" from="56" to="390" dur="3.8s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- IKON GEMBOK VEKTOR -->
    <path d="M172 197 v-3 a4 4 0 0 1 8 0 v3" fill="none" stroke="#FCD34D" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="170" y="197" width="12" height="9" rx="2" fill="#FCD34D"/>
    <text x="190" y="203" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18" font-weight="700" fill="#FCD34D">sedang di-unlock</text>

    <text x="28" y="246" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18" fill="#C7CBEA">GUILD</text>
    <text x="156" y="246" font-family="'Segoe UI',Roboto,sans-serif" font-size="19" font-weight="600" fill="#FFF4E0">SMKN 4 Padalarang · RPL</text>

    <text x="28" y="286" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18" fill="#C7CBEA">QUEST</text>
    <text x="156" y="286" font-family="'Segoe UI',Roboto,sans-serif" font-size="19" font-weight="600" fill="#FFF4E0">
      <tspan x="156" dy="0">PKL di lingkungan</tspan>
      <tspan x="156" dy="24">software development</tspan>
    </text>

    <!-- PEMBATAS DALAM KARTU -->
    <line x1="28" y1="330" x2="532" y2="330" stroke="#2A2563" stroke-width="2"/>

    <!-- JALUR PROGRES KUALITATIF (TANPA ANGKA PALSU) -->
    <text x="28" y="362" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18" font-weight="700" fill="#C7CBEA">ARAH BELAJAR</text>
    <text x="224" y="362" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18" fill="#C7CBEA">Eksplor</text>
    <text x="364" y="362" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18" fill="#C7CBEA">Latihan</text>
    <text x="500" y="362" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18" fill="#C7CBEA">Nyaman</text>

    <!-- TRACK 1: FRONTEND -> NYAMAN -->
    <text x="28" y="400" font-family="'Segoe UI',Roboto,sans-serif" font-size="18" font-weight="700" fill="#F9A8D4">Frontend</text>
    <line x1="224" y1="394" x2="500" y2="394" stroke="#2A2563" stroke-width="6" stroke-linecap="round"/>
    <line x1="224" y1="394" x2="224" y2="394" stroke="#F472B6" stroke-width="6" stroke-linecap="round">
      <animate attributeName="x2" from="224" to="500" begin="0.2s" dur="0.9s" fill="freeze"/>
    </line>
    <circle cx="224" cy="394" r="5" fill="#F472B6"/>
    <circle cx="364" cy="394" r="5" fill="#F472B6"/>
    <circle cx="500" cy="394" r="8" fill="#F9A8D4" stroke="#0B1026" stroke-width="2"/>

    <!-- TRACK 2: FULLSTACK -> LATIHAN -->
    <text x="28" y="434" font-family="'Segoe UI',Roboto,sans-serif" font-size="18" font-weight="700" fill="#FCD34D">Fullstack</text>
    <line x1="224" y1="428" x2="500" y2="428" stroke="#2A2563" stroke-width="6" stroke-linecap="round"/>
    <line x1="224" y1="428" x2="224" y2="428" stroke="#FCD34D" stroke-width="6" stroke-linecap="round">
      <animate attributeName="x2" from="224" to="364" begin="0.4s" dur="0.8s" fill="freeze"/>
    </line>
    <circle cx="224" cy="428" r="5" fill="#FCD34D"/>
    <circle cx="364" cy="428" r="8" fill="#FCD34D" stroke="#0B1026" stroke-width="2"/>
    <circle cx="500" cy="428" r="5" fill="#2A2563" stroke="#C7CBEA" stroke-width="1.5"/>

    <!-- TRACK 3: DATA ENG. -> EKSPLOR -->
    <text x="28" y="468" font-family="'Segoe UI',Roboto,sans-serif" font-size="18" font-weight="700" fill="#67E8F9">Data Eng.</text>
    <line x1="224" y1="462" x2="500" y2="462" stroke="#2A2563" stroke-width="6" stroke-linecap="round"/>
    <circle cx="224" cy="462" r="8" fill="#67E8F9" stroke="#0B1026" stroke-width="2">
      <animate attributeName="r" values="7;9.5;7" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="364" cy="462" r="5" fill="#2A2563" stroke="#C7CBEA" stroke-width="1.5"/>
    <circle cx="500" cy="462" r="5" fill="#2A2563" stroke="#C7CBEA" stroke-width="1.5"/>

    <!-- MOTTO -->
    <text x="280" y="502" text-anchor="middle" font-family="'Segoe UI',Roboto,sans-serif" font-size="18" font-style="italic" font-weight="600" fill="#F9A8D4">「paham dulu cara kerjanya, baru ngebut.」</text>
  </g>

  <rect x="1" y="1" width="558" height="518" rx="17" fill="none" stroke="#F472B6" stroke-opacity="0.6" stroke-width="2"/>
</svg>
