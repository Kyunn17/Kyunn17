<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="Status panel: Frontend nyaman sebagai fokus utama; Fullstack sedang dipelajari; Data Engineering sedang dieksplor">
  <title>Status Panel — Khairul Faridz</title>
  <desc>Panel HUD bergaya cyber merah yang menampilkan status kualitatif keahlian tanpa angka palsu.</desc>
  <style>
    .row-1, .row-2, .row-3 { opacity: 1; }
    .led-warn, .led-info { opacity: 1; }
    @media (prefers-reduced-motion: no-preference) {
      @keyframes hudIn {
        0%   { opacity: 0.35; transform: translateY(4px); }
        100% { opacity: 1; transform: translateY(0px); }
      }
      @keyframes ledPulse {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.75; }
      }
      .row-1 { animation: hudIn 0.35s ease-out 0s both; }
      .row-2 { animation: hudIn 0.35s ease-out 0.1s both; }
      .row-3 { animation: hudIn 0.35s ease-out 0.2s both; }
      .led-warn { animation: ledPulse 3s ease-in-out infinite; }
      .led-info { animation: ledPulse 4s ease-in-out infinite; }
    }
  </style>
  <defs>
    <linearGradient id="spBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0508"/>
      <stop offset="100%" stop-color="#14070c"/>
    </linearGradient>
    <filter id="ledGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="spClip"><rect width="640" height="300" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#spClip)">
    <rect width="640" height="300" fill="url(#spBg)"/>

    <!-- HEADER BAR -->
    <rect width="640" height="50" fill="#1a0810"/>
    <line x1="0" y1="50" x2="640" y2="50" stroke="#ff1744" stroke-width="2"/>
    <rect x="22" y="19" width="12" height="12" fill="#ff1744"/>
    <text x="44" y="32" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="20" font-weight="700" fill="#FFF1EC">STATUS PANEL // SYS.KF</text>

    <!-- GANTI STATUS DI SINI -->
    <!-- BARIS 1: FRONTEND -->
    <g class="row-1">
      <text x="32" y="102" font-family="'Segoe UI',Roboto,sans-serif" font-size="22" font-weight="800" fill="#FFF1EC">Frontend</text>
      <text x="32" y="124" font-family="'Segoe UI',Roboto,sans-serif" font-size="16" fill="#F3C9CF">fokus utama</text>
      <circle cx="250" cy="100" r="7" fill="#ff1744" filter="url(#ledGlow)"/>
      <rect x="272" y="81" width="102" height="38" rx="8" fill="#7a0a1a" fill-opacity="0.35" stroke="#ff1744" stroke-width="1.6"/>
      <text x="323" y="106" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18" font-weight="700" fill="#ff6b81">NYAMAN</text>
    </g>

    <line x1="32" y1="142" x2="608" y2="142" stroke="#7a0a1a" stroke-opacity="0.45" stroke-width="1"/>

    <!-- BARIS 2: FULLSTACK -->
    <g class="row-2">
      <text x="32" y="182" font-family="'Segoe UI',Roboto,sans-serif" font-size="22" font-weight="800" fill="#FFF1EC">Fullstack</text>
      <circle class="led-warn" cx="250" cy="175" r="7" fill="#ff3b3b"/>
      <rect x="272" y="156" width="298" height="38" rx="8" fill="#1a0810" stroke="#ff3b3b" stroke-width="1.5"/>
      <text x="421" y="181" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace,'Yu Gothic','Meiryo','Hiragino Sans',sans-serif" font-size="18" font-weight="700" fill="#FFF1EC">SEDANG DIPELAJARI · <tspan fill="#ff6b81">学習中</tspan></text>
    </g>

    <line x1="32" y1="212" x2="608" y2="212" stroke="#7a0a1a" stroke-opacity="0.45" stroke-width="1"/>

    <!-- BARIS 3: DATA ENGINEERING -->
    <g class="row-3">
      <text x="32" y="252" font-family="'Segoe UI',Roboto,sans-serif" font-size="22" font-weight="800" fill="#FFF1EC">Data Engineering</text>
      <circle class="led-info" cx="250" cy="245" r="7" fill="#5ad1e6"/>
      <rect x="272" y="226" width="298" height="38" rx="8" fill="#1a0810" stroke="#5ad1e6" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="6 4"/>
      <text x="421" y="251" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace,'Yu Gothic','Meiryo','Hiragino Sans',sans-serif" font-size="18" font-weight="700" fill="#F3C9CF">SEDANG DIEKSPLOR · <tspan fill="#5ad1e6">学習中</tspan></text>
    </g>

    <!-- SUDUT HUD -->
    <path d="M12,34 V12 H34 M606,12 H628 V34 M12,266 V288 H34 M606,288 H628 V266" fill="none" stroke="#ff1744" stroke-width="2.5"/>
  </g>
  <rect x="1" y="1" width="638" height="298" rx="15" fill="none" stroke="#7a0a1a" stroke-width="2"/>
</svg>
