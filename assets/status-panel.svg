<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-label="Status panel: Frontend nyaman sebagai fokus utama; Fullstack sedang dipelajari; Data Engineering sedang dieksplor">
  <title>Status Panel — Khairul Faridz</title>
  <desc>Panel status minimalis obsidian dan merah vermilion menampilkan status kualitatif keahlian.</desc>
  <style>
    .row-1, .row-2, .row-3 { opacity: 1; }
    .led-pulse { opacity: 1; }
    @media (prefers-reduced-motion: no-preference) {
      @keyframes hudIn {
        0%   { opacity: 0.4; transform: translateY(4px); }
        100% { opacity: 1; transform: translateY(0px); }
      }
      @keyframes ledPulse {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.7; }
      }
      .row-1 { animation: hudIn 0.35s ease-out 0s both; }
      .row-2 { animation: hudIn 0.35s ease-out 0.1s both; }
      .row-3 { animation: hudIn 0.35s ease-out 0.2s both; }
      .led-pulse { animation: ledPulse 3.2s ease-in-out infinite; }
    }
  </style>
  <defs>
    <linearGradient id="spBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0C0E"/>
      <stop offset="100%" stop-color="#13151A"/>
    </linearGradient>
    <clipPath id="spClip"><rect width="640" height="280" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#spClip)">
    <rect width="640" height="280" fill="url(#spBg)"/>

    <!-- HEADER BAR -->
    <rect width="640" height="46" fill="#16181F"/>
    <line x1="0" y1="46" x2="640" y2="46" stroke="#DC2626" stroke-width="2"/>
    <rect x="24" y="17" width="10" height="10" rx="2" fill="#DC2626"/>
    <text x="44" y="29" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18" font-weight="700" fill="#F3F4F6">STATUS PANEL // SYS.KF</text>

    <!-- GANTI STATUS DI SINI -->
    <!-- BARIS 1: FRONTEND -->
    <g class="row-1">
      <text x="28" y="92" font-family="'Segoe UI',Roboto,sans-serif" font-size="21" font-weight="700" fill="#F3F4F6">Frontend</text>
      <text x="28" y="114" font-family="'Segoe UI',Roboto,sans-serif" font-size="15" fill="#9CA3AF">fokus utama</text>
      <circle cx="248" cy="92" r="5.5" fill="#EF4444"/>
      <rect x="270" y="74" width="104" height="36" rx="6" fill="#991B1B" fill-opacity="0.32" stroke="#DC2626" stroke-width="1.5"/>
      <text x="322" y="98" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="17" font-weight="700" fill="#F3F4F6">NYAMAN</text>
    </g>

    <line x1="28" y1="132" x2="612" y2="132" stroke="#27272A" stroke-width="1"/>

    <!-- BARIS 2: FULLSTACK -->
    <g class="row-2">
      <text x="28" y="172" font-family="'Segoe UI',Roboto,sans-serif" font-size="21" font-weight="700" fill="#F3F4F6">Fullstack</text>
      <circle class="led-pulse" cx="248" cy="166" r="5.5" fill="#F59E0B"/>
      <rect x="270" y="148" width="298" height="36" rx="6" fill="#16181F" stroke="#DC2626" stroke-width="1.4"/>
      <text x="419" y="172" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace,'Yu Gothic','Meiryo','Hiragino Sans',sans-serif" font-size="17" font-weight="700" fill="#F3F4F6">SEDANG DIPELAJARI · <tspan fill="#EF4444">学習中</tspan></text>
    </g>

    <line x1="28" y1="200" x2="612" y2="200" stroke="#27272A" stroke-width="1"/>

    <!-- BARIS 3: DATA ENGINEERING -->
    <g class="row-3">
      <text x="28" y="240" font-family="'Segoe UI',Roboto,sans-serif" font-size="21" font-weight="700" fill="#F3F4F6">Data Engineering</text>
      <circle class="led-pulse" cx="248" cy="234" r="5.5" fill="#38BDF8"/>
      <rect x="270" y="216" width="298" height="36" rx="6" fill="#16181F" stroke="#38BDF8" stroke-opacity="0.7" stroke-width="1.4" stroke-dasharray="5 4"/>
      <text x="419" y="240" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace,'Yu Gothic','Meiryo','Hiragino Sans',sans-serif" font-size="17" font-weight="700" fill="#D1D5DB">SEDANG DIEKSPLOR · <tspan fill="#38BDF8">学習中</tspan></text>
    </g>
  </g>
  <rect x="1" y="1" width="638" height="278" rx="13" fill="none" stroke="#27272A" stroke-width="2"/>
</svg>
